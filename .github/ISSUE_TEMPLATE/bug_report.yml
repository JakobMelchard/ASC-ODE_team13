name: Bug report
description: Report a defect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Search existing issues first.
        For security issues, do not open a public issue; contact the maintainers privately.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong? Include the relevant context.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal and exact steps. Include commands where relevant.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead? Include the error or the wrong result.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or commit hash.
      placeholder: "v1.2.3 or abc1234"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler or runtime, and relevant dependency versions.
      placeholder: |
        OS:
        Compiler/runtime:
        Dependencies:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant logs, stack traces, or command output as text.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, related issues, suspected cause, or a proposed fix.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest version of the default branch.
          required: true
        - label: I included the version and enough detail to reproduce the problem.
          required: true
